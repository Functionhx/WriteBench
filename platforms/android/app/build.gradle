plugins { id 'com.android.application' }
android {
    namespace 'com.functionhx.writebench'
    compileSdk 35
    defaultConfig {
        applicationId 'com.functionhx.writebench'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('WRITEBENCH_KEYSTORE')) {
                storeFile file(System.getenv('WRITEBENCH_KEYSTORE'))
                storePassword System.getenv('WRITEBENCH_SIGNING_PASSWORD')
                keyAlias 'writebench'
                keyPassword System.getenv('WRITEBENCH_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
