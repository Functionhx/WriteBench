name: WriteBench
options:
  bundleIdPrefix: com.chen
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "6"
targets:
  WriteBench:
    type: application
    platform: macOS
    sources:
      - WriteBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chen.WriteBench
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_CFBundleDisplayName: WriteBench
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 WriteBench"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: WriteBench/App/WriteBench.entitlements
  WriteBenchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WriteBenchTests]
    dependencies:
      - target: WriteBench
schemes:
  WriteBench:
    build:
      targets:
        WriteBench: all
        WriteBenchTests: [test]
    test:
      targets: [WriteBenchTests]
